{% extends 'base.html' %}
{% block content %}
<h2>Dayflow — Sign Up</h2>
<form method="POST" id="signupForm">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="text" name="employee_id" placeholder="Employee ID" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <input type="text" name="phone" placeholder="Mobile" style="flex:1; min-width:150px;">

    <select name="role" id="roleSelect" onchange="toggleAdminCode()">
        <option value="employee">Employee</option>
        <option value="admin">Admin / HR</option>
    </select>

    <div id="adminCodeField" style="display:none; width:100%;">
        <input type="text" name="admin_code" placeholder="Admin Authorization Code" style="width:100%;">
    </div>

    <h3 style="width:100%; margin-bottom:0;">Org Info</h3>
    <input type="text" name="job_title" placeholder="Job Title / Job Position" style="flex:1; min-width:180px;">
    <input type="text" name="company" placeholder="Company" style="flex:1; min-width:150px;">
    <input type="text" name="department" placeholder="Department" style="flex:1; min-width:150px;">
    <input type="text" name="manager" placeholder="Manager" style="flex:1; min-width:150px;">
    <input type="text" name="location" placeholder="Location" style="flex:1; min-width:150px;">

    <h3 style="width:100%; margin-bottom:0;">Resume <span style="font-size:12px; color:#818cf8;">(visible only to you and Admin)</span></h3>
    <input type="text" name="work_experience" placeholder="Work Experience (e.g. 2 years as Backend Developer)" style="width:100%;">
    <input type="text" name="previous_company" placeholder="Previous Company (if any)" style="flex:1; min-width:200px;">
    <input type="text" name="skills" placeholder="Skills (comma-separated)" style="width:100%;">

    <h3 style="width:100%; margin-bottom:0;">Private Info <span style="font-size:12px; color:#818cf8;">(visible only to you and Admin)</span></h3>
    <input type="text" name="date_of_birth" placeholder="Date of Birth (DD/MM/YYYY)" style="flex:1; min-width:180px;">
    <input type="text" name="residing_address" placeholder="Residing Address" style="width:100%;">
    <input type="text" name="nationality" placeholder="Nationality" style="flex:1; min-width:150px;">
    <input type="email" name="personal_email" placeholder="Personal Email" style="flex:1; min-width:200px;">
    <select name="gender" style="flex:1; min-width:150px;">
        <option value="">Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
        <option value="Prefer not to say">Prefer not to say</option>
    </select>
    <select name="marital_status" style="flex:1; min-width:150px;">
        <option value="">Marital Status</option>
        <option value="Single">Single</option>
        <option value="Married">Married</option>
        <option value="Other">Other</option>
    </select>
    <input type="text" name="date_of_joining" placeholder="Date of Joining (DD/MM/YYYY)" style="flex:1; min-width:180px;">

    <h3 style="width:100%; margin-bottom:0;">Salary Info <span style="font-size:12px; color:#818cf8;">(visible only to you and Admin)</span></h3>
    <input type="text" name="bank_account_number" placeholder="Bank Account Number" style="flex:1; min-width:200px;">
    <input type="text" name="bank_name" placeholder="Bank Name" style="flex:1; min-width:180px;">
    <input type="text" name="ifsc_code" placeholder="IFSC Code" style="flex:1; min-width:150px;">
    <input type="text" name="pan_no" placeholder="PAN No" style="flex:1; min-width:150px;">
    <input type="text" name="uan_no" placeholder="UAN No" style="flex:1; min-width:150px;">

    <button type="submit">Create Account</button>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Login</a></p>

<script>
function toggleAdminCode() {
    const role = document.getElementById('roleSelect').value;
    document.getElementById('adminCodeField').style.display = role === 'admin' ? 'block' : 'none';
}
</script>
{% endblock %}
